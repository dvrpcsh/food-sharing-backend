spring.application.name=food-sharing

# ================================================================
# MySQL DataSource
# 로컬 개발 시 아래 값을 채워서 사용 (운영 환경은 환경변수로 오버라이드)
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/food_sharing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=star15321!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================================
# JPA / Hibernate
# - ddl-auto: 개발 단계에서는 update, 운영에서는 반드시 none 또는 validate
# - show-sql: 개발 시 쿼리 확인용 (운영에서는 false)
# ================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================================
# Jackson
# Kotlin data class의 null 필드를 JSON 직렬화에서 제외 (BaseResponse와 연계)
# ================================================================
spring.jackson.default-property-inclusion=non_null

# ================================================================
# JWT
# - secret: HS256 서명에 사용할 키 (운영 환경에서는 환경변수로 오버라이드)
# - expiration-period: Access Token 유효 기간 (ms 단위, 현재 1시간)
# ================================================================
jwt.secret=food-sharing-jwt-secret-key-for-local-development-please-change-in-production
jwt.expiration-period=3600000
